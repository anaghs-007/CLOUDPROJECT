services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-acscp}
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./baseline_schema.sql:/docker-entrypoint-initdb.d/02-baseline-schema.sql:ro
      - ./adaptive_schema.sql:/docker-entrypoint-initdb.d/03-adaptive-schema.sql:ro
      - ./identity_enforcement.sql:/docker-entrypoint-initdb.d/04-identity-schema.sql:ro
      - ./dashboard_schema.sql:/docker-entrypoint-initdb.d/05-dashboard-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-acscp}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keycloak/realm-ac-scp.json:/opt/keycloak/data/import/realm-ac-scp.json:ro

volumes:
  postgres-data:
